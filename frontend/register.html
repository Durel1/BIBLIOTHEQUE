<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Créer un compte | Bibliothèque</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

<div class="auth-page">

    <section class="auth-visual">

        <div class="brand">
            <span class="brand-icon">📚</span>
            Biblio
        </div>

        <div class="auth-visual-content">

            <h1>
                Construisez votre
                bibliothèque.
            </h1>

            <p>
                Créez votre espace personnel et commencez
                à organiser les livres qui comptent pour vous.
            </p>

        </div>

        <p class="auth-quote">
            Votre collection reste associée uniquement à votre compte.
        </p>

    </section>


    <section class="auth-panel">

        <div class="auth-card">

            <h2>Créer un compte</h2>

            <p class="auth-subtitle">
                Quelques secondes suffisent pour commencer.
            </p>


            <form id="register-form">

                <div class="form-group">

                    <label for="username">
                        Nom d'utilisateur
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Votre nom"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Adresse e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="vous@exemple.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Choisissez un mot de passe"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button
                    class="primary-button"
                    type="submit"
                >
                    Créer mon compte
                </button>

            </form>


            <p
                id="register-error"
                class="error-message"
                role="alert"
            ></p>

            <p
                id="register-success"
                class="success-message"
            ></p>


            <p class="auth-footer">

                Déjà un compte ?

                <a href="login.html">
                    Se connecter
                </a>

            </p>

        </div>

    </section>

</div>


<script
    type="module"
    src="js/auth.js"
></script>

</body>
</html>
