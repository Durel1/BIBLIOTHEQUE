spring.application.name=bibliotheque-api

# PostgreSQL / Supabase
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate validates the schema.
# Flyway owns schema creation and migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=app

# Flyway
spring.flyway.enabled=true
spring.flyway.default-schema=app
spring.flyway.schemas=app
spring.flyway.create-schemas=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# HTTP server
# Render provides PORT in production.
# Locally, Spring Boot continues to use 8080.
server.port=${PORT:8080}

# Frontend allowed to call the API.
# Locally: http://localhost:5500
# In production: the Vercel URL will be provided by Render.
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5500}