# H2 database used only during automated tests
spring.datasource.url=jdbc:h2:mem:bibliotheque;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Keep this datasource during @DataJpaTest
spring.test.database.replace=none

# Flyway creates the schema, Hibernate validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=app

spring.flyway.enabled=true
spring.flyway.default-schema=app
spring.flyway.schemas=app
spring.flyway.create-schemas=true
